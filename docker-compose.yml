services:
    tailscale:
        image: tailscale/tailscale:latest
        container_name: adguard-tailscale
        restart: unless-stopped
        cap_add:
            - NET_ADMIN
            - NET_RAW
        devices:
            - /dev/net/tun:/dev/net/tun
        sysctls:
            - net.ipv6.conf.all.disable_ipv6=0
            - net.ipv6.conf.default.disable_ipv6=0
            - net.ipv6.conf.all.accept_ra=2
            - net.ipv6.conf.default.accept_ra=2
        environment:
            - TZ=${TZ:-Asia/Tokyo}
            - TS_AUTHKEY=${TS_AUTHKEY}
            - TS_HOSTNAME=${TS_HOSTNAME:-adguard-home}
            - TS_STATE_DIR=/var/lib/tailscale
            - TS_USERSPACE=false
            - TS_EXTRA_ARGS=--accept-dns=false
        networks:
            adgnet:
                ipv4_address: ${MACVLAN_IP}

        volumes:
            - ./data_tailscale:/var/lib/tailscale
            - ts_socket:/tmp

    adgrd:
        image: adguard/adguardhome:latest
        container_name: adguard-home
        restart: unless-stopped
        network_mode: "service:tailscale"
        volumes:
            - ./config:/opt/adguardhome/conf
            - ./work:/opt/adguardhome/work
            - ./work/hosts:/etc/hosts:ro

    hosts-sync:
        image: tailscale/tailscale:latest
        container_name: adguard-hosts-sync
        restart: unless-stopped
        network_mode: "service:tailscale"
        environment:
            - SYNC_INTERVAL=${SYNC_INTERVAL:-3600}
        volumes:
            - ts_socket:/tmp:ro
            - ./work:/opt/adguardhome/work
            - ./sync_hosts.sh:/sync_hosts.sh:ro
        entrypoint: /bin/sh /sync_hosts.sh

volumes:
    ts_socket:

networks:
    adgnet:
        name: ${MACVLAN_NETWORK_NAME:-macvlan_lan}
        external: true

